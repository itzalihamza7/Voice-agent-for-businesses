# Project-specific DDEV settings. DDEV merges this file into config.yaml.
# Kept separate because `ddev config` rewrites config.yaml and drops comments.

# Database connection for Prisma. These are DDEV's default credentials (local only, not secrets).
# Language models: Ollama runs on the Mac (host.docker.internal from inside the container).
# Secrets such as OPENAI_API_KEY go in .ddev/.env.web, which git ignores.
web_environment:
    - DATABASE_URL=postgresql://db:db@db:5432/db
    - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    - OLLAMA_MODEL=qwen3:8b
    # Switches off the hidden "thinking" step of reasoning models like Qwen 3 (30x slower with it).
    - OLLAMA_REASONING_EFFORT=none
    - OPENAI_MODEL=gpt-4.1-mini
    # OpenAI models that may be picked (non-reasoning models; prices in pipeline/pricing.ts).
    - OPENAI_MODELS=gpt-4.1-mini,gpt-4.1-nano,gpt-4o-mini
    # Local development only: lets webhook/MCP tools reach this machine (e.g. the demo MCP server
    # at http://localhost:3000/api/demo-mcp). Never set this in production (SSRF protection).
    - TOOLS_ALLOW_PRIVATE_HOSTS=true
    # Embedding models for the knowledge base: documents are embedded with each; the first is used
    # in calls. Ollama's needs `ollama pull nomic-embed-text`.
    - EMBEDDING_MODELS=ollama/nomic-embed-text,openai/text-embedding-3-small

# Runs the Next.js dev server inside the web container. On every `ddev start` it first
# installs dependencies, applies database migrations and seeds demo data (all idempotent),
# so a fresh clone works with just `ddev start`.
web_extra_daemons:
    - name: next-dev
      command: bash -c 'npm install && npm run db:setup && npm run dev -w @voice-agent/web -- --hostname 0.0.0.0 --port 3000'
      directory: /var/www/html

# Sends https://voice-agent.ddev.site straight to the Next.js dev server.
web_extra_exposed_ports:
    - name: next
      container_port: 3000
      http_port: 80
      https_port: 443
