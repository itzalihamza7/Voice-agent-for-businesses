# Project-specific DDEV settings. DDEV merges this file into config.yaml.
# Kept separate because `ddev config` rewrites config.yaml and drops comments.

# Database connection for Prisma. These are DDEV's default credentials (local only, not secrets).
# Language models: Ollama runs on the Mac (host.docker.internal from inside the container).
# Secrets such as OPENAI_API_KEY go in .ddev/.env.web, which git ignores.
web_environment:
    - DATABASE_URL=postgresql://db:db@db:5432/db
    - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    - OLLAMA_MODEL=qwen3:8b
    # Switches off the hidden "thinking" step of reasoning models like Qwen 3 (30x slower with it).
    - OLLAMA_REASONING_EFFORT=none
    - OPENAI_MODEL=gpt-4.1-mini
    # OpenAI models that may be picked (non-reasoning models; prices in pipeline/pricing.ts).
    - OPENAI_MODELS=gpt-4.1-mini,gpt-4o-mini
    # Local development only: lets webhook/MCP tools reach this machine (e.g. the demo MCP server
    # at http://localhost:3000/api/demo-mcp). Never set this in production (SSRF protection).
    - TOOLS_ALLOW_PRIVATE_HOSTS=true
    # Embedding models for the knowledge base: documents are embedded with each; the first is used
    # in calls. Ollama's needs `ollama pull nomic-embed-text`.
    - EMBEDDING_MODELS=ollama/nomic-embed-text,openai/text-embedding-3-small
    # Speech for voice calls (speech-to-text and text-to-speech providers).
    - VOICE_STT=openai
    - VOICE_TTS=openai
    # Phone calls: the voice gateway (apps/voice-gateway) talks to this app with a shared secret.
    # Local value only; set a long random one in production.
    - GATEWAY_SECRET=local-dev-gateway-secret
    - PHONE_MODEL=openai/gpt-4o-mini
    - WEB_URL=http://localhost:3000
    # Encrypts businesses' own API keys (local value only; a long random one in production).
    - APP_SECRET=local-dev-app-secret-change-me
    # The demo owner's password (demo@example.com), local only.
    - DEMO_PASSWORD=demo-password
    # The platform admin (sees every business), local only.
    - ADMIN_EMAIL=admin@example.com
    - ADMIN_PASSWORD=admin-password

# Runs the Next.js dev server inside the web container. On every `ddev start` it first
# installs dependencies, applies database migrations, seeds demo data and, while the knowledge
# base is empty, adds the example documents (all idempotent),
# so a fresh clone works with just `ddev start`.
web_extra_daemons:
    - name: next-dev
      command: bash -c 'npm install && npm run db:setup && npm run kb:seed && npm run dev -w @voice-agent/web -- --hostname 0.0.0.0 --port 3000'
      directory: /var/www/html
    # Phone calls (Twilio media streams). Waits for the web app's npm install to finish.
    - name: voice-gateway
      command: bash -c 'until [ -f node_modules/.bin/tsx ]; do sleep 2; done; npm run dev -w @voice-agent/voice-gateway'
      directory: /var/www/html

# Sends https://voice-agent.ddev.site straight to the Next.js dev server, and port 8443 to the
# voice gateway (for Twilio through a tunnel such as ngrok).
web_extra_exposed_ports:
    - name: next
      container_port: 3000
      http_port: 80
      https_port: 443
    - name: voice-gateway
      container_port: 8080
      http_port: 8080
      https_port: 8443
