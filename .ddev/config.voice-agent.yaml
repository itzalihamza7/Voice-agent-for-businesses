# Project-specific DDEV settings. DDEV merges this file into config.yaml.
# Kept separate because `ddev config` rewrites config.yaml and drops comments.

# Database connection for Prisma. These are DDEV's default credentials (local only, not secrets).
web_environment:
    - DATABASE_URL=postgresql://db:db@db:5432/db

# Runs the Next.js dev server inside the web container. On every `ddev start` it first
# installs dependencies, applies database migrations and seeds demo data (all idempotent),
# so a fresh clone works with just `ddev start`.
web_extra_daemons:
    - name: next-dev
      command: bash -c 'npm install && npm run db:setup && npm run dev -w @voice-agent/web -- --hostname 0.0.0.0 --port 3000'
      directory: /var/www/html

# Sends https://voice-agent.ddev.site straight to the Next.js dev server.
web_extra_exposed_ports:
    - name: next
      container_port: 3000
      http_port: 80
      https_port: 443
